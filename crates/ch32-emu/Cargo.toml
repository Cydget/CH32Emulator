[package]
name = "ch32-emu"
version = "0.1.0"
edition = "2021"
description = "CH32V203 interpreter with a web pin and variable debugger"
license = "MIT OR Apache-2.0"

[lib]
name = "ch32_emu"
path = "src/lib.rs"

[[bin]]
name = "ch32-emu"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["multipart", "ws"] }
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
object = { version = "0.37", features = ["std"] }
rustc-demangle = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "signal"] }
tower-http = { version = "0.6", features = ["fs"] }
