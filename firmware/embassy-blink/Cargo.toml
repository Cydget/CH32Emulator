[package]
name = "embassy-blink"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
ch32-hal = { git = "https://github.com/ch32-rs/ch32-hal", features = [
    "ch32v203c8t6",
    "memory-x",
    "embassy",
    "rt",
    "time-driver-tim2",
], default-features = false }
embassy-time = "0.5"
embassy-executor = { version = "0.10", features = [
    "platform-riscv32",
    "executor-thread",
] }
qingke = { version = "0.8", features = ["unsafe-trust-wch-atomics"] }
qingke-rt = "0.8"
panic-halt = "1"

[profile.release]
opt-level = "z"
lto = true
strip = false
